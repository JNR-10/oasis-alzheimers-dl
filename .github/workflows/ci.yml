name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (CPU torch wheels)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Typecheck
        run: mypy

      - name: Test
        run: pytest -m "not requires_data and not requires_gpu" --cov=oasis_dl --cov-report=term-missing

  data-hygiene:
    name: no data or weights committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject imaging volumes, weights, and large files
        run: |
          set -euo pipefail

          echo "--- scanning tracked files ---"
          if git ls-files | grep -Ei '\.(nii|nii\.gz|img|hdr|mgz|mgh|dcm|pt|pth|ckpt|onnx|safetensors)$'; then
            echo "::error::Imaging volumes or model weights are tracked. See docs/adr/0008-reproducibility-contract.md"
            exit 1
          fi

          echo "--- scanning for files over 5 MB ---"
          oversized=$(git ls-files -z \
            | xargs -0 -I{} find {} -size +5M -print 2>/dev/null \
            | grep -v '^docs/proposal/' || true)
          if [ -n "$oversized" ]; then
            echo "::error::Files over 5 MB are tracked outside docs/proposal/:"
            echo "$oversized"
            exit 1
          fi

          echo "clean"
