# docs/protocol/evaluation.md

# Chosen on validation subjects, then applied unchanged to test. Selecting it on test
# data would turn the test partition into a tuning set.
threshold_objective: youden

# Resampling subjects, not visits — resampling visits breaks the within-subject
# correlation the subject-level protocol exists to respect.
n_resamples: 1000
confidence_level: 0.95
seed: 42

# Both aggregations are computed. They diverge when visit count correlates with label;
# when they do, both go in the report.
report_per_visit: true
report_per_subject: true

checkpoint_path: ???
