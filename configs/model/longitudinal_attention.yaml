# Encoder plus temporal module. Identical to shared_encoder except for the temporal
# block — the one variable of ablation 1.

defaults:
  - shared_encoder

name: longitudinal_attention

temporal:
  # Follows the encoder rather than restating its width. A temporal module built for a
  # width the encoder does not emit is a shape error at the first batch; worse, one
  # built for a width it *does* emit by coincidence silently survives an encoder swap.
  embedding_dim: ${encoder.embedding_dim}
  n_heads: 4
  # Kept small: the cohort is small and Transformer components overfit it readily
  # (docs/audits/).
  n_layers: 2
  dropout: 0.1
  elapsed_time_scale_days: 365.25
