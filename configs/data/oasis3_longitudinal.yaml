# The primary cohort (ADR-0003), subsampled and coarsened for a semester-sized compute
# budget (ADR-0010).

name: oasis3_longitudinal
root: ${paths.data_root}/raw/oasis3
manifest_path: ${paths.data_root}/manifests/oasis3_cohort.csv

# Only T1-weighted scans are downloaded. PET and CT are most of OASIS-3 by volume and
# are unused by every arm.
modalities: [T1w]

# --- subject sampling (ADR-0010) ---
# Drawn once with this seed, BEFORE partitioning, and never redrawn — sampling after
# seeing results is the same error as redrawing a split, and leaves no trace in the
# partition. Raising max_subjects produces a different cohort whose results do not
# merge with this one's. null means take every eligible subject.
sampling:
  max_subjects: 300
  sample_seed: 20261122

# --- inclusion rules (docs/data/cohort-definition.md) ---
# max_assessment_gap_days is the open parameter of ADR-0004. The value below is a
# placeholder and is fixed from the real data before any model trains.
inclusion:
  max_assessment_gap_days: 365
  min_visits_for_longitudinal: 2
  require_preprocessing_success: true

# --- partitioning (ADR-0001) ---
# Drawn once with this seed and never redrawn. Changing it invalidates every result
# computed before the change.
#
# 60/20/20 rather than 70/15/15: at 300 sampled subjects a 15% validation partition is
# too small to select a threshold on.
split_seed: 42
split_ratios: [0.60, 0.20, 0.20]

# --- preprocessing (docs/protocol/preprocessing.md) ---
# Identical across every arm. A difference here would confound the ablations.
#
# 96^3 under ADR-0010. Cost scales with voxel count, so this is the largest single
# compute lever available. The signal here is gross atrophy — at this resolution the
# hippocampus still spans several hundred voxels. The encoder reads this shape by
# interpolation, so the two cannot drift apart.
volume_shape: [96, 96, 96]

# ADR-0011 constrains how that 96^3 is reached. The encoder's pretrained weights expect
# volumes registered to the BrainIAC template and resized, not resampled to an isotropic
# 2 mm — and that template is not isotropic, so the effective voxel size is anisotropic
# and no longer a free parameter. The real figure comes from the template header in #15;
# it is left unset rather than carried over, because 2.0 here would be a plausible
# number that is no longer true.
voxel_size_mm: _tbd_   # #15, constrained by ADR-0011

# Still open in #16, and still the right question: registering each scan independently
# to a template risks absorbing the within-subject atrophy the temporal module exists to
# read. ADR-0011 fixes *which* template, not whether the subject-level step comes first.
registration_target: within_subject_then_template
intensity_normalization: zscore

# Visits kept per sequence, counting back from the target visit. Three under ADR-0010;
# most eligible subjects contribute fewer than this anyway, so the cut costs little.
max_sequence_length: 3

# Conservative by design — aggressive spatial augmentation on structural MRI destroys
# the atrophy signal the task depends on. Applied identically across a subject's
# visits, never independently per visit.
augmentation:
  enabled: true
  rotation_degrees: 5
  translation_voxels: 4
  scale_range: [0.95, 1.05]
  intensity_sigma: 0.05
