# The declared fallback (ADR-0003). Using this is an event, not a default:
# record it in docs/data/access-log.md and name it in the report.
#
# OASIS-2 is far smaller (~150 subjects, 373 sessions). Results do not transfer from
# OASIS-3 — a fallback resets the baselines rather than inheriting their numbers.

defaults:
  - oasis3_longitudinal

name: oasis2_fallback
root: ${paths.data_root}/raw/oasis2
manifest_path: ${paths.data_root}/manifests/oasis2_cohort.csv

# Smaller cohort, so a larger validation share — a 15% validation partition of 150
# subjects is too small to select a threshold on.
split_ratios: [0.60, 0.20, 0.20]
