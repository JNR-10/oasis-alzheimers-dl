[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oasis-dl"
version = "0.1.0"
description = "Longitudinal deep learning for Alzheimer's disease detection from structural MRI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["alzheimers", "mri", "longitudinal", "deep-learning", "oasis", "neuroimaging"]

authors = [
  { name = "Jainil Narendrakumar Rana" },
  { name = "Nirupam Narayana Maladi" },
  { name = "Mohit Manoj Barade" },
]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
  # --- core numerics ---
  "numpy>=1.26,<3",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",

  # --- deep learning ---
  "torch>=2.2",
  "monai>=1.3",
  "torchio>=0.19",

  # --- neuroimaging io ---
  "nibabel>=5.2",

  # --- configuration and experiment tracking ---
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "tensorboard>=2.15",

  # --- reporting ---
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "types-PyYAML",
  "pandas-stubs",
]
notebooks = [
  "jupyterlab>=4.0",
  "ipywidgets>=8.1",
  "nilearn>=0.10",
]

[project.urls]
Repository = "https://github.com/JNR-10/oasis-alzheimers-dl"
Predecessor = "https://github.com/JNR-10/oasis-alzheimers-ml"
Dataset = "https://sites.wustl.edu/oasisbrains/home/oasis-3/"

[project.scripts]
oasis-cohort     = "oasis_dl.cli.build_cohort:main"
oasis-preprocess = "oasis_dl.cli.preprocess:main"
oasis-train      = "oasis_dl.cli.train:main"
oasis-evaluate   = "oasis_dl.cli.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oasis_dl"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter
  "N803",    # X / y / X_train are the conventional names in this domain
  "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.mypy]
python_version = "3.10"
files = ["src/oasis_dl"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["monai.*", "torchio.*", "nibabel.*", "sklearn.*", "seaborn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: test that takes more than a few seconds",
  "requires_data: test that needs a local OASIS cohort and is skipped in CI",
  "requires_gpu: test that needs CUDA and is skipped in CI",
]
